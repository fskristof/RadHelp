<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RadHelp – Radiológiai Score Kalkulátor</title>
<meta name="description" content="Magyar nyelvű, offline radiológiai scoring kalkulátor (TI-RADS és további rendszerek)" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RadHelp" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="offline-banner" class="offline-banner hidden">Nincs internetkapcsolat – offline módban dolgozik</div>

  <header class="app-header">
    <div class="header-inner">
      <button id="btn-back" class="icon-btn hidden" aria-label="Vissza">←</button>
      <div class="brand-lockup">
        <img class="brand-logo" src="icons/radhelp-logo.png" alt="" aria-hidden="true" />
        <h1 id="header-title">RadHelp</h1>
      </div>
      <div class="header-spacer"></div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <div id="toast" class="toast"></div>

  <footer class="app-footer">
    <p>Csak klinikai döntéstámogató eszköz – nem helyettesíti a szakorvosi véleményt.</p>
  </footer>

  <script src="registry.js"></script>
  <script src="scores/tirads.js"></script>
  <script src="app.js"></script>
</body>
</html>
